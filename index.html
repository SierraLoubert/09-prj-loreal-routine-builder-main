<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>L'Oréal | Smart Routine & Product Advisor</title>

    <!-- Google Fonts -->
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;500;700&display=swap"
      rel="stylesheet"
    />

    <!-- Material Icons -->
    <link
      href="https://fonts.googleapis.com/icon?family=Material+Icons"
      rel="stylesheet"
    />

    <!-- Font Awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"
    />

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>

    <div class="page-wrapper">

      <!------- Header ------->
      <header class="site-header">
        <img
          src="img/loreal-logo.png"
          alt="L'Oréal Logo"
          class="logo"
        />

        <h1 class="site-title">
          Your Personalized Beauty Assistant
        </h1>
      </header>

      <main>

        <!------- Category Filter ------->
        <section class="search-section">

          <select id="categoryFilter">

            <option value="" disabled selected>
              Choose a Category
            </option>

            <option value="cleanser">Cleansers</option>

            <option value="moisturizer">
              Moisturizers & Treatments
            </option>

            <option value="haircare">
              Haircare
            </option>

            <option value="makeup">
              Makeup
            </option>

            <option value="hair color">
              Hair Color
            </option>

            <option value="hair styling">
              Hair Styling
            </option>

            <option value="men's grooming">
              Men's Grooming
            </option>

            <option value="suncare">
              Suncare
            </option>

            <option value="fragrance">
              Fragrance
            </option>

          </select>

        </section>

        <!------- Products ------->
        <section>

          <div
            id="productsContainer"
            class="products-grid">
          </div>

        </section>

        <!------- Selected Products ------->
        <section class="selected-products">

          <h2>Selected Products</h2>

          <div id="selectedProductsList"></div>

          <button
            id="generateRoutine"
            class="generate-btn">

            <i class="fa-solid fa-wand-magic-sparkles"></i>

            Generate Routine

          </button>

        </section>

        <!------- Chat ------->
        <section class="chatbox">

          <h2>Let's Build Your Routine</h2>

          <div
            id="chatWindow"
            class="chat-window">
            <!-- Messages added by JavaScript -->
          </div>

          <form
            id="chatForm"
            class="chat-form">

            <label
              for="userInput"
              class="visually-hidden">
              Message
            </label>

            <input
              id="userInput"
              name="userInput"
              type="text"
              placeholder="Ask me about products or routines…"
              autocomplete="off"
              required
            />

            <button
              type="submit"
              id="sendBtn">

              <span class="material-icons">
                send
              </span>

              <span class="visually-hidden">
                Send
              </span>

            </button>

          </form>

        </section>

      </main>

      <!------- Footer ------->
      <footer class="site-footer">

        <p>&copy; 2026 L'Oréal. All rights reserved.</p>

        <nav>

          <a href="#">
            Privacy Policy
          </a>

          <a href="#">
            Terms of Use
          </a>

          <a href="#">
            Contact
          </a>

        </nav>

      </footer>

    </div>

    <script src="script.js"></script>

  </body>
</html>
